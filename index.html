<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop ảnh → URL wsrv.nl</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f7;color:#111}
  .wrap{max-width:600px;margin:0 auto;padding:20px 14px 36px}
  h1{font-size:20px;margin:4px 0 14px}
  .row{display:flex;gap:8px}
  .row input[type=url]{flex:1;padding:11px 12px;border:1.5px solid #d4d4d8;border-radius:10px;font-size:15px;min-width:0}
  .row input[type=url]:focus{outline:none;border-color:#4f46e5}
  button{cursor:pointer;border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;background:#4f46e5;color:#fff}
  button:hover{opacity:.92}
  button.copy{background:#111827;width:100%;margin-top:8px}
  #status{font-size:13.5px;margin:10px 0;min-height:18px;color:#555}
  #status.err{color:#dc2626}
  #status.ok{color:#059669}
  .editor{background:#111827;border-radius:12px;min-height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .editor img{max-width:100%;display:block}
  .editor .ph{color:#9ca3af;font-size:14px;padding:60px 10px;text-align:center}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 6px;font-size:14.5px}
  .bar select{padding:9px 10px;border:1.5px solid #d4d4d8;border-radius:9px;font-size:14.5px;background:#fff}
  .bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .bar input[type=checkbox]{width:17px;height:17px;accent-color:#4f46e5}
  textarea{width:100%;min-height:76px;padding:11px;border:1.5px solid #4f46e5;border-radius:10px;background:#eef2ff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;word-break:break-all;resize:vertical}
  .lbl{font-size:13px;font-weight:700;color:#374151;margin:14px 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>✂️ Crop ảnh → URL wsrv.nl</h1>

  <div class="row">
    <input type="url" id="url" placeholder="Dán URL ảnh vào đây…" spellcheck="false">
    <button id="load">Tải ảnh</button>
  </div>
  <div id="status"></div>

  <div class="editor" id="box">
    <div class="ph" id="ph">Chưa có ảnh</div>
    <img id="img" alt="" style="display:none">
  </div>

  <div class="bar">
    <span>Định dạng file đầu ra:
      <select id="fmt">
        <option value="png">PNG</option>
        <option value="jpg" selected>JPG</option>
        <option value="webp">WebP</option>
        <option value="avif">AVIF</option>
        <option value="gif">GIF</option>
      </select>
    </span>
  </div>

  <div class="lbl">URL kết quả</div>
  <textarea id="out" readonly placeholder="Crop xong URL sẽ hiện ở đây…"></textarea>
  <button class="copy" id="copy">📋 Copy URL</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const urlIn = $("url"), statusEl = $("status"), img = $("img"), out = $("out");
let cropper = null, source = "", lastLoaded = "";

function cleanUrl(v) {
  v = (v || "").trim().replace(/^["'`“”‘’]+|["'`“”‘’]+$/g, "").trim();
  if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
  return v;
}
function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = cls || ""; }

function updateOut() {
  if (!cropper || !source) return;
  const d = cropper.getData();
  const x = Math.max(0, Math.round(d.x)), y = Math.max(0, Math.round(d.y));
  const w = Math.round(d.width), h = Math.round(d.height);
  out.value = "https://wsrv.nl/?url=" + encodeURIComponent(source) +
    "&cx=" + x + "&cy=" + y + "&cw=" + w + "&ch=" + h + "&precrop" +
    "&output=" + $("fmt").value;
}

function load() {
  const src = cleanUrl(urlIn.value);
  if (!src) { setStatus("Chưa nhập URL ảnh.", "err"); return; }
  urlIn.value = src; source = src; lastLoaded = src;
  if (cropper) { cropper.destroy(); cropper = null; }
  out.value = "";
  setStatus("Đang tải ảnh…", "");
  // Tải qua wsrv.nl để tránh bị CDN gốc (Shopee…) chặn tải trực tiếp từ trình duyệt.
  let viaProxy = true;
  img.onload = () => {
    setStatus("Đã tải ảnh. Kéo khung để crop.", "ok");
    $("ph").style.display = "none"; img.style.display = "block";
    cropper = new Cropper(img, {
      // Khung mở đầu là hình vuông 1:1 ở giữa ảnh, nhưng kéo góc/cạnh thì chỉnh tự do (không khóa tỉ lệ)
      aspectRatio: NaN,
      viewMode: 1, autoCropArea: 0.8, responsive: true,
      zoomable: false, zoomOnWheel: false, zoomOnTouch: false, movable: false,
      crop: updateOut,
      ready: function () {
        const W = img.naturalWidth, H = img.naturalHeight;
        const side = Math.round(Math.min(W, H) * 0.8);
        this.setData({ x: Math.round((W - side) / 2), y: Math.round((H - side) / 2), width: side, height: side });
        setTimeout(updateOut, 0);
      }
    });
  };
  img.onerror = () => {
    if (viaProxy) { viaProxy = false; img.src = src; } // thử lại trực tiếp
    else setStatus("Không tải được ảnh từ URL này.", "err");
  };
  img.src = "https://wsrv.nl/?url=" + encodeURIComponent(src);
}

$("load").addEventListener("click", load);
urlIn.addEventListener("keydown", e => { if (e.key === "Enter") load(); });
$("fmt").addEventListener("change", updateOut);
// Dán / nhập đúng URL ảnh vào là tự tải luôn, không cần bấm nút
let autoTimer = null;
function maybeAutoLoad() {
  const v = cleanUrl(urlIn.value);
  if (!v || v === lastLoaded) return;
  if (!/^https?:\/\/[^\s]+\.[^\s]{2,}/i.test(v)) return;
  load();
}
urlIn.addEventListener("paste", () => setTimeout(maybeAutoLoad, 60));
urlIn.addEventListener("input", () => { clearTimeout(autoTimer); autoTimer = setTimeout(maybeAutoLoad, 700); });
$("copy").addEventListener("click", async () => {
  if (!out.value) return;
  try { await navigator.clipboard.writeText(out.value); }
  catch (e) { out.select(); document.execCommand("copy"); }
  $("copy").textContent = "✔ Đã copy";
  setTimeout(() => $("copy").textContent = "📋 Copy URL", 1500);
});
// Kéo thả URL ảnh vào trang cũng tải được
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  const t = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain");
  if (t) { urlIn.value = t.trim().split("\n")[0]; load(); }
});
</script>
</body>
</html>
