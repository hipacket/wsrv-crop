<style>
  *{box-sizing:border-box}

  .row input[type=url]:focus{outline:none;border-color:#4f46e5}
  button{cursor:pointer;border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;background:#4f46e5;color:#fff}

  .bar input[type=checkbox]{width:17px;height:17px;accent-color:#4f46e5}
  textarea{width:100%;min-height:76px;padding:11px;border:1.5px solid #4f46e5;border-radius:10px;background:#eef2ff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;word-break:break-all;resize:vertical}
  .bmbar{background:#eef2ff;border:1px dashed #4f46e5;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 14px;line-height:1.6}
  .bmbtn{display:inline-block;background:#4f46e5;color:#fff;font-weight:700;padding:5px 14px;border-radius:999px;text-decoration:none;cursor:grab;margin-left:6px}

<body>
<div class="wrap">
  <h1>✂️ Crop ảnh → URL wsrv.nl</h1>

  <div class="bmbar">🚀 Dùng nhanh trên mọi trang: kéo nút này lên thanh bookmark của Chrome (bật thanh bằng Ctrl+Shift+B), sau này đang xem ảnh chỉ cần bấm nút là crop:<a class="bmbtn" href="javascript:(function%20()%20%7B%20if%20(window.__wsrvCropOn)%20return%3B%20window.__wsrvCropOn%20%3D%201%3B%20var%20imgs%20%3D%20Array.prototype.slice.call(document.images).filter(function%20(i)%20%7B%20return%20i.naturalWidth%20%3E%3D%2050%20%26%26%20i.naturalHeight%20%3E%3D%2050%3B%20%7D)%3B%20var%20isImgDoc%20%3D%20(document.contentType%20%7C%7C%20%22%22).indexOf(%22image%2F%22)%20%3D%3D%3D%200%3B%20function%20pick()%20%7B%20var%20tip%20%3D%20document.createElement(%22div%22)%3B%20tip.textContent%20%3D%20%22B%E1%BA%A5m%20v%C3%A0o%20%E1%BA%A3nh%20mu%E1%BB%91n%20crop%22%3B%20tip.style.cssText%20%3D%20%22position%3Afixed%3Btop%3A12px%3Bleft%3A50%25%3Btransform%3AtranslateX(-50%25)%3Bbackground%3A%23111827%3Bcolor%3A%23fff%3Bpadding%3A10px%2018px%3Bborder-radius%3A999px%3Bz-index%3A2147483647%3Bfont%3A14px%20system-ui%2Csans-serif%22%3B%20document.body.appendChild(tip)%3B%20function%20h(e)%20%7B%20var%20t%20%3D%20e.target%3B%20if%20(t%20%26%26%20t.tagName%20%3D%3D%3D%20%22IMG%22)%20%7B%20e.preventDefault()%3B%20e.stopPropagation()%3B%20document.removeEventListener(%22click%22%2C%20h%2C%20true)%3B%20tip.remove()%3B%20start(t)%3B%20%7D%20%7D%20document.addEventListener(%22click%22%2C%20h%2C%20true)%3B%20%7D%20function%20start(img)%20%7B%20var%20src%20%3D%20isImgDoc%20%3F%20location.href%20%3A%20(img.currentSrc%20%7C%7C%20img.src)%3B%20var%20r%20%3D%20img.getBoundingClientRect()%3B%20var%20w%20%3D%20r.width%20%7C%7C%20img.naturalWidth%2C%20h%20%3D%20r.height%20%7C%7C%20img.naturalHeight%3B%20var%20maxW%20%3D%20window.innerWidth%2C%20maxH%20%3D%20window.innerHeight%3B%20var%20ratios%20%3D%20%5B1%2C%20maxW%20%2F%20w%2C%20maxH%20%2F%20h%5D%3B%20if%20(img.naturalWidth)%20ratios.push(img.naturalWidth%20%2F%20w%2C%20img.naturalHeight%20%2F%20h)%3B%20var%20s%20%3D%20Math.min.apply(null%2C%20ratios)%3B%20var%20W%20%3D%20Math.max(50%2C%20Math.round(w%20*%20s))%2C%20H%20%3D%20Math.max(50%2C%20Math.round(h%20*%20s))%3B%20var%20css%20%3D%20document.createElement(%22link%22)%3B%20css.rel%20%3D%20%22stylesheet%22%3B%20css.href%20%3D%20%22https%3A%2F%2Fcdnjs.cloudflare.com%2Fajax%2Flibs%2Fcropperjs%2F1.6.2%2Fcropper.min.css%22%3B%20document.head.appendChild(css)%3B%20var%20sc%20%3D%20document.createElement(%22script%22)%3B%20sc.src%20%3D%20%22https%3A%2F%2Fcdnjs.cloudflare.com%2Fajax%2Flibs%2Fcropperjs%2F1.6.2%2Fcropper.min.js%22%3B%20sc.onerror%20%3D%20function%20()%20%7B%20window.__wsrvCropOn%20%3D%200%3B%20alert(%22Kh%C3%B4ng%20t%E1%BA%A3i%20%C4%91%C6%B0%E1%BB%A3c%20th%C6%B0%20vi%E1%BB%87n%20crop%20(c%E1%BA%A7n%20internet%2C%20ho%E1%BA%B7c%20trang%20n%C3%A0y%20ch%E1%BA%B7n%20script%20ngo%C3%A0i).%22)%3B%20%7D%3B%20sc.onload%20%3D%20function%20()%20%7B%20ui(src%2C%20W%2C%20H)%3B%20%7D%3B%20document.head.appendChild(sc)%3B%20%7D%20function%20ui(src%2C%20W%2C%20H)%20%7B%20var%20ov%20%3D%20document.createElement(%22div%22)%3B%20ov.style.cssText%20%3D%20%22position%3Afixed%3Binset%3A0%3Bbackground%3Argba(8%2C8%2C12%2C.96)%3Bz-index%3A2147483646%3Bdisplay%3Aflex%3Bflex-direction%3Acolumn%3Balign-items%3Acenter%3Bjustify-content%3Acenter%3Bpadding%3A0%3Bbox-sizing%3Aborder-box%3Bfont-family%3Asystem-ui%2Csans-serif%22%3B%20var%20hint%20%3D%20document.createElement(%22div%22)%3B%20hint.textContent%20%3D%20%22K%C3%A9o%20crop%20%E2%86%92%20d%E1%BB%ABng%20tay%20~1%2C5%20gi%C3%A2y%2C%20tab%20t%E1%BB%B1%20chuy%E1%BB%83n%20sang%20link%20%C4%91%C3%A3%20crop%20%E2%80%A2%20Enter%2Fnh%E1%BA%A5p%20%C4%91%C3%BAp%3A%20%C4%91i%20ngay%20%E2%80%A2%20Esc%3A%20hu%E1%BB%B7%22%3B%20hint.style.cssText%20%3D%20%22position%3Aabsolute%3Bbottom%3A14px%3Bleft%3A50%25%3Btransform%3AtranslateX(-50%25)%3Bbackground%3Argba(17%2C24%2C39%2C.92)%3Bcolor%3A%23e5e7eb%3Bpadding%3A8px%2016px%3Bborder-radius%3A999px%3Bz-index%3A5%3Bfont-size%3A13px%3Bwhite-space%3Anowrap%22%3B%20ov.appendChild(hint)%3B%20var%20stage%20%3D%20document.createElement(%22div%22)%3B%20stage.style.cssText%20%3D%20%22width%3A%22%20%2B%20W%20%2B%20%22px%3Bheight%3A%22%20%2B%20H%20%2B%20%22px%3Bflex%3Anone%22%3B%20var%20im%20%3D%20document.createElement(%22img%22)%3B%20im.src%20%3D%20src%3B%20im.style.cssText%20%3D%20%22width%3A100%25%3Bheight%3A100%25%3Bdisplay%3Ablock%22%3B%20stage.appendChild(im)%3B%20ov.appendChild(stage)%3B%20document.body.appendChild(ov)%3B%20var%20cr%20%3D%20null%2C%20timer%20%3D%20null%3B%20function%20buildUrl()%20%7B%20var%20d%20%3D%20cr.getData()%3B%20return%20%22https%3A%2F%2Fwsrv.nl%2F%3Furl%3D%22%20%2B%20encodeURIComponent(src)%20%2B%20%22%26cx%3D%22%20%2B%20Math.max(0%2C%20Math.round(d.x))%20%2B%20%22%26cy%3D%22%20%2B%20Math.max(0%2C%20Math.round(d.y))%20%2B%20%22%26cw%3D%22%20%2B%20Math.round(d.width)%20%2B%20%22%26ch%3D%22%20%2B%20Math.round(d.height)%20%2B%20%22%26precrop%26output%3Djpg%22%3B%20%7D%20function%20go()%20%7B%20if%20(cr)%20location.href%20%3D%20buildUrl()%3B%20%7D%20function%20arm()%20%7B%20clearTimeout(timer)%3B%20timer%20%3D%20setTimeout(go%2C%201500)%3B%20%7D%20function%20close()%20%7B%20clearTimeout(timer)%3B%20document.removeEventListener(%22keydown%22%2C%20onKey%2C%20true)%3B%20ov.remove()%3B%20window.__wsrvCropOn%20%3D%200%3B%20%7D%20function%20onKey(e)%20%7B%20if%20(e.key%20%3D%3D%3D%20%22Enter%22)%20%7B%20e.preventDefault()%3B%20go()%3B%20%7D%20else%20if%20(e.key%20%3D%3D%3D%20%22Escape%22)%20%7B%20e.preventDefault()%3B%20close()%3B%20%7D%20%7D%20document.addEventListener(%22keydown%22%2C%20onKey%2C%20true)%3B%20im.addEventListener(%22dblclick%22%2C%20go)%3B%20function%20init()%20%7B%20cr%20%3D%20new%20Cropper(im%2C%20%7B%20aspectRatio%3A%20NaN%2C%20viewMode%3A%201%2C%20autoCropArea%3A%200.8%2C%20background%3A%20false%2C%20zoomable%3A%20false%2C%20zoomOnWheel%3A%20false%2C%20zoomOnTouch%3A%20false%2C%20movable%3A%20false%2C%20ready%3A%20function%20()%20%7B%20var%20W2%20%3D%20im.naturalWidth%2C%20H2%20%3D%20im.naturalHeight%2C%20side   <div class="row">
    <input type="url" id="url" placeholder="Dán URL ảnh vào đây…" spellcheck="false">
    <button id="load">Tải ảnh</button>
  </div>
  <div id="status"></div>

  <div class="editor" id="box">
    <div class="ph" id="ph">Chưa có ảnh</div>
    <img id="img" alt="" style="display:none">
  </div>

  <div class="bar">
    <span>Định dạng file đầu ra:
      <select id="fmt">
        <option value="png">PNG</option>
        <option value="jpg" selected>JPG</option>
        <option value="webp">WebP</option>
        <option value="avif">AVIF</option>
        <option value="gif">GIF</option>
      </select>
    </span>
  </div>

  <div class="lbl">URL kết quả</div>
  <textarea id="out" readonly placeholder="Crop xong URL sẽ hiện ở đây…"></textarea>
  <button class="copy" id="copy">📋 Copy URL</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const urlIn = $("url"), statusEl = $("status"), img = $("img"), out = $("out");
let cropper = null, source = "", lastLoaded = "";

function cleanUrl(v) {
  v = (v || "").trim().replace(/^["'`“”‘’]+|["'`“”‘’]+$/g, "").trim();
  if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
  return v;
}
function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = cls || ""; }

function updateOut() {
  if (!cropper || !source) return;
  const d = cropper.getData();
  const x = Math.max(0, Math.round(d.x)), y = Math.max(0, Math.round(d.y));
  const w = Math.round(d.width), h = Math.round(d.height);
  out.value = "https://wsrv.nl/?url=" + encodeURIComponent(source) +
    "&cx=" + x + "&cy=" + y + "&cw=" + w + "&ch=" + h + "&precrop" +
    "&output=" + $("fmt").value;
}

function load() {
  const src = cleanUrl(urlIn.value);
  if (!src) { setStatus("Chưa nhập URL ảnh.", "err"); return; }
  urlIn.value = src; source = src; lastLoaded = src;
  if (cropper) { cropper.destroy(); cropper = null; }
  out.value = "";
  setStatus("Đang tải ảnh…", "");
  // Tải qua wsrv.nl để tránh bị CDN gốc (Shopee…) chặn tải trực tiếp từ trình duyệt.
  let viaProxy = true;
  img.onload = () => {
    setStatus("Đã tải ảnh. Kéo khung để crop.", "ok");
    $("ph").style.display = "none"; img.style.display = "block";
    cropper = new Cropper(img, {
      // Khung mở đầu là hình vuông 1:1 ở giữa ảnh, nhưng kéo góc/cạnh thì chỉnh tự do (không khóa tỉ lệ)
      aspectRatio: NaN,
      viewMode: 1, autoCropArea: 0.8, responsive: true, background: false,
      zoomable: false, zoomOnWheel: false, zoomOnTouch: false, movable: false,
      crop: updateOut,
      ready: function () {
        const W = img.naturalWidth, H = img.naturalHeight;
        const side = Math.round(Math.min(W, H) * 0.8);
        let tries = 0;
        (function apply() {
          if (cropper) {
            cropper.setData({ x: Math.round((W - side) / 2), y: Math.round((H - side) / 2), width: side, height: side });
            setTimeout(updateOut, 0);
          } else if (tries++ < 20) setTimeout(apply, 100);
        })();
      }
    });
  };
  img.onerror = () => {
    if (viaProxy) { viaProxy = false; img.src = src; } // thử lại trực tiếp
    else setStatus("Không tải được ảnh từ URL này.", "err");
  };
  img.src = "https://wsrv.nl/?url=" + encodeURIComponent(src);
}

$("load").addEventListener("click", load);
urlIn.addEventListener("keydown", e => { if (e.key === "Enter") load(); });
$("fmt").addEventListener("change", updateOut);
// Dán / nhập đúng URL ảnh vào là tự tải luôn, không cần bấm nút
let autoTimer = null;
function maybeAutoLoad() {
  const v = cleanUrl(urlIn.value);
  if (!v || v === lastLoaded) return;
  if (!/^https?:\/\/[^\s]+\.[^\s]{2,}/i.test(v)) return;
  load();
}
urlIn.addEventListener("paste", () => setTimeout(maybeAutoLoad, 60));
urlIn.addEventListener("input", () => { clearTimeout(autoTimer); autoTimer = setTimeout(maybeAutoLoad, 700); });
$("copy").addEventListener("click", async () => {
  if (!out.value) return;
  try { await navigator.clipboard.writeText(out.value); }
  catch (e) { out.select(); document.execCommand("copy"); }
  $("copy").textContent = "✔ Đã copy";
  setTimeout(() => $("copy").textContent = "📋 Copy URL", 1500);
});
// Kéo thả URL ảnh vào trang cũng tải được
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  const t = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain");
  if (t) { urlIn.value = t.trim().split("\n")[0]; load(); }
});
</script>
</body>
